spring.application.name=talentmatch

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:talentmatchdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Kafka (Redpanda)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=talentmatch-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.topic.matching-requests=matching-requests

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,matching-stats
management.endpoint.health.show-details=always

# Ollama
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:1b

# GitHub
github.api.base-url=https://api.github.com
github.api.user-agent=TalentMatch-AI
